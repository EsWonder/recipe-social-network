version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: auth_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  register-user:
    build:
      context: ./register-user
    env_file:
      - ./register-user/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  login-user:
    build:
      context: ./login-user
    env_file:
      - ./login-user/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  logout-user:
    build:
      context: ./logout-user
    ports:
      - "9000:9000"

  get-user-profile:
    build:
      context: ./get-user-profile
    env_file:
      - ./get-user-profile/.env
    ports:
      - "3100:3100"
    depends_on:
      - postgres

  update-user-profile:
    build:
      context: ./update-user-profile
    env_file:
      - ./update-user-profile/.env
    ports:
      - "3200:3200"
    depends_on:
      - postgres

  change-password:
    build:
      context: ./change-password
    env_file:
      - ./change-password/.env
    ports:
      - "3300:3300"
    depends_on:
      - postgres

volumes:
  postgres_data: