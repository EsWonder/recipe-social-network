version: "3.9"

services:
  # 🧠 Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 💬 Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 🛡️ auth-user microservice
  auth-user:
    build:
      context: ./apps/auth-domain/auth-user
      dockerfile: Dockerfile
    container_name: auth-user
    depends_on:
      - kafka
      - auth-user-db
    env_file:
      - ./apps/auth-domain/auth-user/.env
    volumes:
      - ./apps/auth-domain/auth-user:/app
    restart: always

  # 🗃️ auth-user PostgreSQL database
  auth-user-db:
    image: postgres:15
    container_name: auth-user-db
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: auth_user_db
    volumes:
      - auth-user-dbdata:/var/lib/postgresql/data

volumes:
  auth-user-dbdata:
