<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Social - Auth Panel</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #ff6b6b;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background-color: #fff3f3;
      border-bottom: 1px solid #ddd;
    }
    nav button {
      background: none;
      border: none;
      padding: 15px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      color: #333;
      border-radius: 5px;
    }
    nav button:hover {
      background-color: #ffe0e0;
    }
    .tab {
      display: none;
      max-width: 400px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .tab.active {
      display: block;
    }
    input, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 14px;
    }
    pre, p {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍲 Recipe Social - User Panel</h1>
    <p>Manage your account in our delicious community!</p>
  </header>

  <nav>
    <button onclick="showTab('register')">Register</button>
    <button onclick="showTab('login')">Login</button>
    <button onclick="showTab('profile')">Get Profile</button>
    <button onclick="showTab('update')">Update Profile</button>
    <button onclick="showTab('change')">Change Password</button>
    <button onclick="logout()">Logout</button>
  </nav>

  <div id="register" class="tab">
    <h3>Register</h3>
    <input id="reg-name" placeholder="Name">
    <input id="reg-email" placeholder="Email">
    <input id="reg-pass" type="password" placeholder="Password">
    <button onclick="register()">Submit</button>
    <p id="reg-result"></p>
  </div>

  <div id="login" class="tab">
    <h3>Login</h3>
    <input id="log-email" placeholder="Email">
    <input id="log-pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="log-result"></p>
  </div>

  <div id="profile" class="tab">
    <h3>Your Profile</h3>
    <button onclick="getProfile()">Load Profile</button>
    <pre id="profile-result"></pre>
  </div>

  <div id="update" class="tab">
    <h3>Update Profile</h3>
    <input id="upd-name" placeholder="New Name">
    <input id="upd-email" placeholder="New Email">
    <button onclick="updateProfile()">Update</button>
    <p id="upd-result"></p>
  </div>

  <div id="change" class="tab">
    <h3>Change Password</h3>
    <input id="old-pass" type="password" placeholder="Current Password">
    <input id="new-pass" type="password" placeholder="New Password">
    <button onclick="changePassword()">Change</button>
    <p id="chg-result"></p>
  </div>

  <footer>
    &copy; 2025 Recipe Social Network
  </footer>

  <script>
    function showTab(id) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function register() {
      const res = await fetch('http://localhost:8000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          password: document.getElementById('reg-pass').value
        })
      });
      const data = await res.json();
      document.getElementById('reg-result').innerText = data.message || data.detail;
    }

    async function login() {
      const res = await fetch('http://localhost:3000/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('log-email').value,
          password: document.getElementById('log-pass').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.access_token);
        document.getElementById('log-result').innerText = "Login successful!";
      } else {
        document.getElementById('log-result').innerText = data.message || data.detail;
      }
    }

    async function getProfile() {
      const token = localStorage.getItem('token');
      const res = await fetch('http://localhost:3100/user/profile', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      document.getElementById('profile-result').innerText = JSON.stringify(data, null, 2);
    }

    async function updateProfile() {
      const token = localStorage.getItem('token');
      const res = await fetch('http://localhost:3200/update-profile', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
          name: document.getElementById('upd-name').value,
          email: document.getElementById('upd-email').value
        })
      });
      const data = await res.json();
      document.getElementById('upd-result').innerText = data.message || data.detail;
    }

    async function changePassword() {
      const token = localStorage.getItem('token');
      const res = await fetch('http://localhost:3300/user/change-password', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
          currentPassword: document.getElementById('old-pass').value,
          newPassword: document.getElementById('new-pass').value
        })
      });
      const data = await res.json();
      document.getElementById('chg-result').innerText = data.message || data.detail;
    }

    function logout() {
      localStorage.removeItem('token');
      alert('Logged out!');
    }

    showTab('register');
  </script>
</body>
</html>
