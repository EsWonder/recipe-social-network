<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe Social - Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #fdf2f2; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
    .split-screen { display: flex; height: 100vh; }
    .left-side { background: linear-gradient(135deg, #930303, #6b0000); color: white; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 50px; animation: slideInLeft 1s ease; }
    .left-side h1 { font-size: 48px; margin-bottom: 20px; }
    .left-side p { font-size: 18px; max-width: 400px; }
    .right-side { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; animation: slideInRight 1s ease; }
    .form-box { background: white; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    .tabs { display: flex; margin-bottom: 20px; }
    .tabs button { flex: 1; border: none; padding: 12px; background: #f2cccc; font-weight: bold; color: #333; border-radius: 8px 8px 0 0; cursor: pointer; }
    .tabs button.active { background: #930303; color: white; }
    .tab { display: none; }
    .tab.active { display: block; }
    input, .submit { width: 100%; padding: 12px; margin-top: 12px; border-radius: 6px; border: 1px solid #ccc; }
    .submit { background-color: #930303; color: white; font-weight: bold; border: none; transition: background 0.3s; }
    .submit:hover { background-color: #7a0202; }
    .msg { text-align: center; margin-top: 10px; font-size: 14px; }
    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) {
      .split-screen { flex-direction: column; height: auto; }
      .left-side, .right-side { flex: none; width: 100%; padding: 30px; }
      .left-side { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="split-screen">
    <div class="left-side">
      <h1>🍲 Recipe Social</h1>
      <p>Join the South American community of food lovers. Share your best recipes, discover new flavors, and enjoy cooking together!</p>
    </div>
    <div class="right-side">
      <div class="form-box">
        <div class="tabs">
          <button id="login-tab" class="active" onclick="switchTab('login')">Login</button>
          <button id="register-tab" onclick="switchTab('register')">Register</button>
          <button id="recover-tab" onclick="switchTab('recover')">Recover</button>
        </div>

        <div id="login" class="tab active">
          <input id="log-email" type="email" placeholder="Email" />
          <input id="log-pass" type="password" placeholder="Password" />
          <button class="submit" onclick="login()">Login</button>
          <div id="log-msg" class="msg text-danger"></div>
        </div>

        <div id="register" class="tab">
          <input id="reg-email" type="email" placeholder="Email" />
          <input id="reg-pass" type="password" placeholder="Password" />
          <button class="submit" onclick="register()">Register</button>
          <div id="reg-msg" class="msg text-danger"></div>
        </div>

        <div id="recover" class="tab">
          <input id="rec-email" type="email" placeholder="Email" />
          <input id="rec-pass" type="password" placeholder="New Password" />
          <button class="submit" onclick="recover()">Recover Password</button>
          <div id="rec-msg" class="msg text-danger"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      document.getElementById(tab + '-tab').classList.add('active');
    }

    async function login() {
      const email = document.getElementById('log-email').value;
      const password = document.getElementById('log-pass').value;
      const res = await fetch('http://localhost:8000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.access_token);
        // Simular registrar sesión (solo si el backend soporta user_id por token o respuesta)
        await fetch('http://localhost:8002/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: 1, ip: '127.0.0.1', user_agent: navigator.userAgent })
        });
        window.location.href = 'home.html';
      } else {
        document.getElementById('log-msg').innerText = data.message || data.detail || 'Login failed';
      }
    }

    async function register() {
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-pass').value;
      const res = await fetch('http://localhost:8001/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('reg-msg').innerText = 'Registration successful. You can now log in.';
        switchTab('login');
      } else {
        document.getElementById('reg-msg').innerText = data.message || data.detail || 'Registration failed';
      }
    }

    async function recover() {
      const email = document.getElementById('rec-email').value;
      const new_password = document.getElementById('rec-pass').value;
      const res = await fetch('http://localhost:8003/recover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, new_password })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('rec-msg').innerText = 'Password updated. You can now log in.';
        switchTab('login');
      } else {
        document.getElementById('rec-msg').innerText = data.message || data.detail || 'Recovery failed';
      }
    }
  </script>
</body>
</html>
