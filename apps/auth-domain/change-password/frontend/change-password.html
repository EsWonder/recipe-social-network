<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
</head>
<body>
  <h2>Change Password</h2>
  <form id="change-form">
    <input type="password" id="current" placeholder="Current Password" required><br><br>
    <input type="password" id="new" placeholder="New Password" required><br><br>
    <button type="submit">Change</button>
  </form>
  <p id="response"></p>

  <script>
    const form = document.getElementById("change-form");
    const responseText = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("token");

      const body = {
        currentPassword: document.getElementById("current").value,
        newPassword: document.getElementById("new").value
      };

      try {
        const res = await fetch("http://localhost:3300/user/change-password", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (res.ok) {
          responseText.innerText = data.message;
        } else {
          responseText.innerText = "Error: " + data.message;
        }
      } catch (err) {
        responseText.innerText = "Connection error";
      }
    });
  </script>
</body>
</html>
