<!DOCTYPE html>
<html>
<head>
    <title>Auth User Microservice</title>
    <meta charset="UTF-8" />
</head>
<body>
    <h2>Login</h2>
    <form id="login-form">
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <button type="submit">Login</button>
    </form>

    <h3>Token:</h3>
    <pre id="token-display"></pre>

    <h3>Verify Token</h3>
    <form id="verify-form">
        <input type="text" id="token-input" placeholder="Paste token here"><br><br>
        <button type="submit">Verify</button>
    </form>

    <h4>Verification Result:</h4>
    <pre id="verify-result"></pre>

    <script>
        document.getElementById("login-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const res = await fetch("/auth/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            document.getElementById("token-display").innerText = JSON.stringify(data, null, 2);
        });

        document.getElementById("verify-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const token = document.getElementById("token-input").value;

            const res = await fetch("/auth/verify-token", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({token})
            });
            const data = await res.json();
            document.getElementById("verify-result").innerText = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
