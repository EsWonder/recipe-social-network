<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Profile</title>
</head>
<body>
  <h2>Update Profile</h2>
  <form id="update-form">
    <input type="text" id="name" placeholder="New Name" required><br><br>
    <input type="email" id="email" placeholder="New Email" required><br><br>
    <button type="submit">Update</button>
  </form>
  <p id="response"></p>

  <script>
    const form = document.getElementById("update-form");
    const responseText = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem("token");

      const user = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value
      };

      try {
        const res = await fetch("http://localhost:3200/update-profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(user)
        });

        const data = await res.json();
        if (res.ok) {
          responseText.innerText = data.message;
        } else {
          responseText.innerText = "Error: " + data.detail;
        }
      } catch (err) {
        responseText.innerText = "Connection error";
      }
    });
  </script>
</body>
</html>
